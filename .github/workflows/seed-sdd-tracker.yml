- [ ] Опис ендпоінтів оцінювання журі `POST /submissions/{id}/evaluations` (REQ-F-007).
- [ ] Опис відповіді лідерборду `GET /jams/{id}/leaderboard` (REQ-F-008)."""
              },
              {
                  "title": "[TEST] TICK-TEST-JAM-01: BDD/Unit тести валідації регламенту джему (AC-F-001)",
                  "milestone": "Milestone 3: CORE-GATE (Ядро сабмішнів, SHA-256 та дедлайн)",
                  "labels": ["type:test", "status:ready", "role:agent", "priority:high"],
                  "state": "open",
                  "body": """### 🧪 Розробка автотестів (TDD Red Phase)

**WBS Ticket ID**: `TICK-TEST-JAM-01`
