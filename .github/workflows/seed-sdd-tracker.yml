**Виправлення**: Оновлено regex до `^[a-fA-F0-9]{64}$` та додано нормалізацію через `.lower()`."""
              },
              {
                  "title": "[SPEC] TICK-SPEC-01: Формалізація OpenAPI/Swagger специфікації ендпоінтів Game Jam Analyzer",
                  "milestone": "Milestone 3: CORE-GATE (Ядро сабмішнів, SHA-256 та дедлайн)",
                  "labels": ["type:spec", "status:ready", "role:collaborative", "priority:high"],
