              }
          ]

          # Fetch existing issues to avoid creating duplicates
          existing_issues = api_request(f"https://api.github.com/repos/{repo}/issues?state=all&per_page=100") or []
          existing_titles = {iss["title"]: iss["number"] for iss in existing_issues}

          print(f"Checking {len(issues_def)} defined WBS issues...")
          created_cnt = 0

          for iss in issues_def:
              title = iss["title"]
              m_title = iss.get("milestone")
              m_num = milestone_map.get(m_title)

              payload = {
                  "title": title,
                  "body": iss["body"],
                  "labels": iss["labels"]
              }
              if m_num:
                  payload["milestone"] = m_num

              if title in existing_titles:
                  print(f"Issue already exists: {title} (#{existing_titles[title]})")
                  # Ensure state matches if closed
                  if iss.get("state") == "closed":
                      api_request(f"https://api.github.com/repos/{repo}/issues/{existing_titles[title]}", {"state": "closed"}, "PATCH")
              else:
                  print(f"Creating Issue: {title}")
                  new_iss = api_request(f"https://api.github.com/repos/{repo}/issues", payload, "POST")
                  if new_iss:
                      created_cnt += 1
                      # If issue is defined as closed (e.g., historical PLAN-GATE or resolved Bug)
                      if iss.get("state") == "closed":
                          api_request(f"https://api.github.com/repos/{repo}/issues/{new_iss['number']}", {"state": "closed"}, "PATCH")
                      time.sleep(0.5)

          print(f"\nAll done! Successfully created {created_cnt} new SDD issues with labels & milestones.")
          EOF
