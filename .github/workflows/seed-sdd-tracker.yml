- [ ] Забезпечити захист від ReDoS та ін'єкцій."""
              },
              {
                  "title": "[TEST] TICK-TEST-TIME-01: BDD-тести обробки м'якого дедлайну: облік is_late та штрафів (BDD-SC-002)",
                  "milestone": "Milestone 3: CORE-GATE (Ядро сабмішнів, SHA-256 та дедлайн)",
                  "labels": ["type:test", "status:backlog", "role:agent", "priority:high"],
                  "state": "open",
                  "body": """### 🧪 Тести м'якого дедлайну (Human Override Logic)

**WBS Ticket ID**: `TICK-TEST-TIME-01`
**Зв'язана вимога**: `REQ-F-005` (Підтримка регламенту м'якого дедлайну)
**Критерій прийняття**: `AC-F-005`
**BDD-сценарій**: `BDD-SC-002`
