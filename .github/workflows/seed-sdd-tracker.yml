**Блокує задачу**: `TICK-FEAT-JAM-01`

#### Тестові кейси:
- [ ] Позитивний тест створення джему з валідним часовим проміжком.
- [ ] Негативний тест спроби задати `submission_deadline` раніше за `start_time` (HTTP 422).
- [ ] Негативний тест спроби задати `review_deadline` раніше за дедлайн робіт."""
              },
              {
                  "title": "[FEAT] TICK-FEAT-JAM-01: Модель та API створення і конфігурації джему (src/jams)",
                  "milestone": "Milestone 3: CORE-GATE (Ядро сабмішнів, SHA-256 та дедлайн)",
                  "labels": ["type:feature", "status:backlog", "role:agent", "priority:high"],
                  "state": "open",
                  "body": """### ✨ Реалізація виробничого коду

**WBS Ticket ID**: `TICK-FEAT-JAM-01`
**Зв'язана вимога**: `REQ-F-001`
**Критерій прийняття**: `AC-F-001`
**Заблоковано тестом**: `TICK-TEST-JAM-01`
**Цільовий модуль**: `src/jams/`

#### Завдання:
- [ ] Створити Pydantic/SQLAlchemy схеми для сутності `Jam`.
- [ ] Реалізувати роутер `POST /api/v1/jams`.
- [ ] Прогнати тести до отримання статусу 100% Green."""
              },
              {
                  "title": "[TEST] TICK-TEST-SUB-01: Тести аудиторських реквізитів гри: Git URL та Asset Inventory (AC-F-003)",
                  "milestone": "Milestone 3: CORE-GATE (Ядро сабмішнів, SHA-256 та дедлайн)",
                  "labels": ["type:test", "status:backlog", "role:agent", "priority:critical"],
                  "state": "open",
                  "body": """### 🧪 Автотести аудиту сабмішну

**WBS Ticket ID**: `TICK-TEST-SUB-01`
