                  "labels": ["type:feature", "status:backlog", "role:agent", "priority:high"],
                  "state": "open",
                  "body": """### ✨ Реалізація RBAC захисту даних

**WBS Ticket ID**: `TICK-FEAT-AUTH-01`
**Зв'язана вимога**: `REQ-F-006`, `REQ-NF-002`
**Критерій прийняття**: `AC-F-006`, `AC-NF-002`
**Заблоковано тестом**: `TICK-TEST-AUTH-01`
**Цільовий модуль**: `src/auth/`

#### Завдання:
- [ ] Middleware перевірки ролей (`Guest`, `Participant`, `Judge`, `Organizer`).
- [ ] Фільтрація конфіденційних полів у Pydantic схемах відповіді.
