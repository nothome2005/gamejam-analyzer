name: "🌱 Seed SDD Issues & Milestones"

on:
  push:
    paths:
      - '.github/workflows/seed-sdd-tracker.yml'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  seed-tracker:
    name: "Bootstrap GitHub Issues & Milestones from WBS"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Populate Milestones, Labels and Realistic WBS Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python - << 'EOF'
          import os, json, urllib.request, urllib.error, urllib.parse, time

          token = os.environ.get("GITHUB_TOKEN")
          repo = os.environ.get("REPO")

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "SDDBootstrap"
          }

          def api_request(url, data=None, method="GET"):
              body = json.dumps(data).encode("utf-8") if data else None
              req = urllib.request.Request(url, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.loads(resp.read().decode("utf-8")) if resp.status != 204 else None
              except urllib.error.HTTPError as e:
                  err_msg = e.read().decode("utf-8")
                  print(f"API Error [{e.code}] on {method} {url}: {err_msg}")
                  return None

          # 1. Sync Labels first
          labels_file = ".github/labels.json"
          if os.path.exists(labels_file):
              with open(labels_file, "r", encoding="utf-8") as f:
                  labels_data = json.load(f)
              print(f"Ensuring {len(labels_data)} labels exist...")
              labels_url = f"https://api.github.com/repos/{repo}/labels"
              for lbl in labels_data:
                  lbl_payload = {"name": lbl["name"], "color": lbl["color"], "description": lbl.get("description", "")}
                  res = api_request(labels_url, lbl_payload, "POST")
                  if res is None: # Likely already exists, patch
                      encoded = urllib.parse.quote(lbl["name"])
                      api_request(f"{labels_url}/{encoded}", lbl_payload, "PATCH")

          # 2. Create Milestones
          milestones_def = [
              {"title": "Milestone 1: SPEC-GATE (Вимоги SRS v1.0)", "state": "closed", "desc": "Затвердження нормативної специфікації вимог IEEE 830 та BDD-сценаріїв"},
              {"title": "Milestone 2: PLAN-GATE (Декомпозиція робіт та графік)", "state": "closed", "desc": "Затвердження WBS декомпозиції, мережевого графіку CPM та реєстру ризиків"},
              {"title": "Milestone 3: CORE-GATE (Ядро подання робіт та аудит SHA-256)", "state": "open", "desc": "Реалізація моделі сабмішнів, валідатора SHA-256 та м'якого дедлайну"},
              {"title": "Milestone 4: RELEASE-GATE (Суддівство, лідерборд, реліз)", "state": "open", "desc": "Фіналізація мультикритеріального оцінювання, лідерборду та каталогу робіт"}
          ]

          existing_milestones = api_request(f"https://api.github.com/repos/{repo}/milestones?state=all&per_page=100") or []
          milestone_map = {m["title"]: m["number"] for m in existing_milestones}

          for m in milestones_def:
              if m["title"] not in milestone_map:
                  print(f"Creating Milestone: {m['title']}")
                  m_res = api_request(f"https://api.github.com/repos/{repo}/milestones", {
                      "title": m["title"],
                      "state": m["state"],
                      "description": m["desc"]
                  }, "POST")
                  if m_res:
                      milestone_map[m["title"]] = m_res["number"]
                      time.sleep(0.5)

          # 3. Create realistic SDD issues
          issues_def = [
              {
                  "title": "[GATE] TICK-GATE-01: Затвердження плану декомпозиції робіт та реєстру ризиків (PLAN-GATE)",
                  "milestone": "Milestone 2: PLAN-GATE (Декомпозиція робіт та графік)",
                  "labels": ["type:gate", "status:done", "gate:plan-gate", "role:human-only", "priority:critical"],
                  "state": "closed",
                  "body": """### 🛑 Контрольна точка PLAN-GATE (Затверджено)

**WBS Ticket ID**: `TICK-GATE-01`
**Виконавець**: Студент (Lead Engineer / Human-Only)
**Пов'язані артефакти**:
- `planning/issue-tracker-workflow.md`
- `planning/schedule-and-gantt.md`
- `planning/risk-register.md`
- `planning/project_schedule_cpm.graphml`

#### ✅ Чекліст критеріїв PLAN-GATE:
- [x] Повна WBS декомпозиція системи на 31 тікет (розділення Feature і Test за TDD).
- [x] Розраховано критичний шлях (CPM): тривалість 25.5 годин, резерви часу виявлено.
- [x] Побудовано діаграму Ганта та схему життєвого циклу завдань у yEd GraphML.
- [x] Сформовано реєстр із 8 проєктних ризиків зі стратегіями пом'якшення.
- [x] Підписано офіційний протокол `logs/plan-gate.md`.

**Резолюція**: **GO (Схвалено людиною)**."""
              },
              {
                  "title": "[ADDENDUM] ADD-001: Доповнення формату декларації сторонніх асетів у Asset Inventory",
                  "milestone": "Milestone 2: PLAN-GATE (Декомпозиція робіт та графік)",
                  "labels": ["type:addendum", "status:done", "role:human-only", "priority:medium"],
                  "state": "closed",
                  "body": """### 📜 SRS Addendum Protocol

**ID Адендуму**: `ADD-001`
**Зачеплені вимоги**: `REQ-F-003` (Подання аудиторських даних сабмішну)
**Причина**: Необхідність явного розділення ліцензій на CC-BY та Royalty-Free аудіо-асети.

#### Чекліст узгодження:
- [x] Оновлено `spec/srs.md` та `spec/srs.tex`.
- [x] Зміни узгоджено з матрицею простежуваності `spec/traceability-matrix.md`.
- [x] Рішення затверджено людиною."""
              },
              {
                  "title": "[BUG] Дефект валідації верхнього регістру у 64-символьному хеші SHA-256",
                  "milestone": "Milestone 3: CORE-GATE (Ядро сабмішнів, SHA-256 та дедлайн)",
                  "labels": ["type:bug", "status:done", "role:agent", "priority:high"],
                  "state": "closed",
