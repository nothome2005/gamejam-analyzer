**Критерій прийняття**: `AC-F-003`
**BDD-сценарій**: `BDD-SC-001`
**Блокує задачу**: `TICK-FEAT-SUB-01`

#### Кейси:
- [ ] Перевірка обов'язковості посилання на публічний Git-репозиторій.
- [ ] Перевірка формату `commit_hash` (40 символів sha1 або 64 символи).
- [ ] Перевірка структури списку сторонніх асетів (Asset Inventory)."""
              },
              {
                  "title": "[TEST] TICK-TEST-HASH-01: Негативні та граничні BDD-тести перевірки SHA-256 хешу (BDD-SC-003)",
                  "milestone": "Milestone 3: CORE-GATE (Ядро сабмішнів, SHA-256 та дедлайн)",
                  "labels": ["type:test", "status:in-progress", "role:agent", "priority:critical"],
                  "state": "open",
                  "body": """### 🧪 Тести валідації криптографічного хешу

**WBS Ticket ID**: `TICK-TEST-HASH-01`
**Зв'язана вимога**: `REQ-F-003`
**BDD-сценарій**: `BDD-SC-003` (Відхилення некоректного формату SHA-256)
**Блокує задачу**: `TICK-FEAT-HASH-01`

```gherkin
Scenario: Спроба надіслати некоректний хеш SHA-256
  Given капітан команди заповнює форму реєстрації проєкту
  When у полі "sha256_checksum" введено значення "invalid-hash-too-short"
  Then система відхиляє збереження з помилкою 422
  And повертає повідомлення "Контрольна сума повинна містити рівно 64 шістнадцяткові символи"
```"""
              },
              {
                  "title": "[FEAT] TICK-FEAT-HASH-01: Криптографічний валідатор хешу SHA-256 (64 hex regex, src/submissions)",
                  "milestone": "Milestone 3: CORE-GATE (Ядро сабмішнів, SHA-256 та дедлайн)",
                  "labels": ["type:feature", "status:backlog", "role:agent", "priority:critical"],
                  "state": "open",
                  "body": """### ✨ Реалізація валідатора цілісності коду

