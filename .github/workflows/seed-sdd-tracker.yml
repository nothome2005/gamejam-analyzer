name: "Seed SDD Issues and Milestones"

on:
  push:
    paths:
      - '.github/workflows/seed-sdd-tracker.yml'
      - '.github/scripts/seed_sdd_tracker.py'
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  seed-tracker:
    name: "Bootstrap GitHub Issues and Milestones from WBS"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Populate Milestones, Labels and Realistic WBS Issues
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python .github/scripts/seed_sdd_tracker.py
